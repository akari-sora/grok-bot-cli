# Fork CI. npm publish stays on upstream.
# Linux jobs stay on the project runner. The Windows job uses a GitLab.com
# hosted runner and must not inherit the grok-box tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

unit:
  tags: [grok-box, ondemand, grok-bot-cli]
  image: node:22-slim
  script:
    - npm ci
    - npm run build
    - npm run test:unit

# Hosted Windows spends shared minutes. Always on tags, merge requests, and
# manual web runs. On main, only when shipped code, tests, or packaging change.
# A commit that only touches this file still runs Linux and skips Windows.
# Do not cache node_modules: uploading it costs more minutes than npm ci.
unit-windows:
  tags: [saas-windows-medium-amd64]
  interruptible: true
  timeout: 20m
  needs:
    - job: unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - bin/**/*
        - test/**/*
        - tests/**/*
        - scripts/**/*
        - package.json
        - package-lock.json
  script:
    - |
      $ErrorActionPreference = "Stop"
      $sums = (Invoke-RestMethod "https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt") -split "`n"
      $name = (($sums | Where-Object { $_ -match "win-x64\.zip$" } | Select-Object -First 1) -split "\s+")[1].Trim()
      if (-not $name) { throw "node win-x64 zip not listed" }
      Invoke-WebRequest "https://nodejs.org/dist/latest-v22.x/$name" -OutFile $name
      Expand-Archive $name -DestinationPath node-win -Force
      $nodeHome = (Get-ChildItem node-win -Directory | Select-Object -First 1).FullName
      $env:Path = "$nodeHome;$env:Path"
      node -v
      npm ci
      npm run build
      npm run test:unit
