# Fork CI. npm publish stays on upstream.
# Linux jobs use LINUX_RUNNER_TAG. The Windows job uses WINDOWS_RUNNER_TAG
# and must not inherit the Linux tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Defaults are GitLab.com runners. Override LINUX_RUNNER_TAG and
# WINDOWS_RUNNER_TAG in project CI/CD settings to use your own.
variables:
  LINUX_RUNNER_TAG: saas-linux-small-amd64
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64

default:
  interruptible: true

unit:
  tags: [$LINUX_RUNNER_TAG]
  image: node:22-slim
  script:
    - npm ci
    - npm run build
    # Run the tests as the image's unprivileged user: root ignores the
    # permission bits that the read-only fixtures rely on.
    - chown -R node:node "$CI_PROJECT_DIR"
    - su node -s /bin/sh -c "npm run test:unit"

# Self-hosted Windows. Tags, manual web runs, and main pushes that change
# shipped code, tests, or packaging. A CI-only push still runs Linux only.
# Merge requests are manual: that runner accepts protected refs only.
# Use Node already on PATH when it can run the generated ESM entrypoint.
# Otherwise download Node 22 into this job's temporary directory so the
# runtime is not included in the source snapshot. Do not cache node_modules.
.windows_node: &windows_node
  interruptible: true
  timeout: 20m
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-cache
    paths:
      - .npm-cache
  script:
    - |
      $ErrorActionPreference = "Stop"
      $PSNativeCommandUseErrorActionPreference = $false
      $env:NPM_CONFIG_CACHE = Join-Path $env:CI_PROJECT_DIR ".npm-cache"
      $nodeTemp = $null
      $nodeProbe = 'const [major, minor] = process.versions.node.split(/[.]/).map(Number); process.exit(import.meta.main === true && ((major === 22 && minor >= 19) || (major === 24 && minor >= 2) || major > 24) ? 0 : 42)'
      try {
        $nodeReady = $false
        if (Get-Command node -ErrorAction SilentlyContinue) {
          node --input-type=module -e $nodeProbe
          $nodeReady = $LASTEXITCODE -eq 0
        }
        if (-not $nodeReady) {
          $nodeTemp = Join-Path $env:TEMP "gbot-node-$($env:CI_PROJECT_ID)-$($env:CI_JOB_ID)"
          New-Item -ItemType Directory -Force -Path $nodeTemp | Out-Null
          $sums = (Invoke-RestMethod "https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt") -split "`n"
          $sumLine = $sums | Where-Object { $_ -match "win-x64\.zip$" } | Select-Object -First 1
          if (-not $sumLine) { throw "node win-x64 zip not listed" }
          $parts = $sumLine.Trim() -split "\s+"
          if ($parts.Count -lt 2) { throw "node win-x64 zip not listed" }
          $expected = $parts[0].ToLowerInvariant()
          $name = $parts[-1]
          $zip = Join-Path $nodeTemp $name
          Invoke-WebRequest "https://nodejs.org/dist/latest-v22.x/$name" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "node win-x64 zip checksum mismatch" }
          $dest = Join-Path $nodeTemp "node-win"
          Expand-Archive $zip -DestinationPath $dest -Force
          $nodeHome = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          $env:Path = "$nodeHome;$env:Path"
        }
        node --input-type=module -e $nodeProbe
        if ($LASTEXITCODE -ne 0) { throw "selected Node cannot run the generated ESM entrypoint" }
        node -v
        if ($LASTEXITCODE -ne 0) { throw "node -v failed with exit $LASTEXITCODE" }
        npm ci
        if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit $LASTEXITCODE" }
        npm run build
        if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit $LASTEXITCODE" }
        npm run test:unit
        if ($LASTEXITCODE -ne 0) { throw "npm run test:unit failed with exit $LASTEXITCODE" }
      } finally {
        if ($nodeTemp -and (Test-Path -LiteralPath $nodeTemp)) {
          Remove-Item -LiteralPath $nodeTemp -Recurse -Force
        }
      }

unit-windows:
  <<: *windows_node
  tags: [$WINDOWS_RUNNER_TAG]
  needs:
    - job: unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - bin/**/*
        - test/**/*
        - tests/**/*
        - scripts/**/*
        - package.json
        - package-lock.json

# Same tests on a GitLab-hosted runner. Starts only when someone plays it.
windows:hosted:
  <<: *windows_node
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  needs:
    - job: unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - bin/**/*
        - test/**/*
        - tests/**/*
        - scripts/**/*
        - package.json
        - package-lock.json
      when: manual
