# Fork CI on the grok-box on-demand runner. npm publish stays on upstream.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, grok-bot-cli]
  interruptible: true

unit:
  image: node:22-slim
  script:
    - npm ci
    - npm run build
    - npm run test:unit
